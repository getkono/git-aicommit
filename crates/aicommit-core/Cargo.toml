[package]
name = "aicommit-core"
version = "0.1.0"
description = "Frontend-agnostic commit-message generation: build the prompt, pick the model, ask a backend."
readme = "README.md"
keywords = ["commit", "ai", "claude", "git", "conventional-commits"]
categories = ["development-tools"]
edition.workspace = true
