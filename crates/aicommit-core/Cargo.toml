[package]
name = "aicommit-core"
version = "0.2.0"
description = "Frontend-agnostic commit-message generation over an agent-text Agent."
readme = "README.md"
keywords = ["commit", "ai", "claude", "git", "conventional-commits"]
categories = ["development-tools"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# No `clap`, no `indicatif`, no git. See `cargo tree -p aicommit-core`.
[dependencies]
agent-text.workspace = true
thiserror.workspace = true

[dev-dependencies]
agent-text = { workspace = true, features = ["claude-code"] }
tokio.workspace = true
