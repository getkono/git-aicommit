[workspace]
members = ["crates/aicommit-core", "crates/git-aicommit"]
resolver = "3"

# Shared identity metadata. Deliberately not `version`: the binary keeps its
# user-facing 1.x line while the library starts fresh under 0.x semver.
[workspace.package]
edition = "2024"
rust-version = "1.94"
authors = ["Justin Chung <noreply@justinchung.net>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/getkono/git-aicommit"
homepage = "https://github.com/getkono/git-aicommit"

[workspace.dependencies]
aicommit-core = { version = "0.3.0", path = "crates/aicommit-core" }
agent-text = { version = "0.1.1", default-features = false }
# Diff model and unified-diff parser for the context compressor. Pinned to a git
# rev until karet 0.6.0 (which carries the parser-completeness fixes this relies
# on) reaches crates.io; swap to `version = "0.6"` before merging.
# https://github.com/getkono/karet/pull/218
karet-diff = { git = "https://github.com/getkono/karet", rev = "55f0839086c03ebc54543e79276d7cbf071953b5", default-features = false }
karet-filetype = { git = "https://github.com/getkono/karet", rev = "55f0839086c03ebc54543e79276d7cbf071953b5", default-features = false }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt"] }
which = "8"

# Must live at the workspace root: a `[profile.*]` table in a member manifest is
# ignored (with only a warning), which would silently drop these from releases.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
