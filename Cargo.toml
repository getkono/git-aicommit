[workspace]
members = ["crates/aicommit-core", "crates/git-aicommit"]
resolver = "3"

# Shared identity metadata. Deliberately not `version`: the binary keeps its
# user-facing 1.x line while the library starts fresh under 0.x semver.
[workspace.package]
edition = "2024"
rust-version = "1.94"
authors = ["Justin Chung <noreply@justinchung.net>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/getkono/git-aicommit"
homepage = "https://github.com/getkono/git-aicommit"

[workspace.dependencies]
aicommit-core = { version = "0.2.0", path = "crates/aicommit-core" }
agent-text = { version = "0.1.1", default-features = false }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt"] }
which = "8"

# Must live at the workspace root: a `[profile.*]` table in a member manifest is
# ignored (with only a warning), which would silently drop these from releases.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
